<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{/layout/layout_admin :: main-fragment(
                                                ~{:: title},
                                                'header',
                                                'sidebar',
                                                ~{:: #css-resources},
                                                ~{:: #js-resources},
                                                ~{:: #main-content}
                                               )}">
<head>
  <meta charset="UTF-8">
  <title>Thêm Mã Giảm Giá</title>
  <!-- Link Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
<section role="main" class="content-body" id="main-content">
  <h2 class="text-center mb-4">Thêm Đợt Giảm Giá</h2>
  <div class="card">
    <br>
    <div th:if="${message}" class="alert"
         th:classappend="${messageType == 'success' ? 'alert-success' : 'alert-danger'}">
      <span th:text="${message}"></span>
    </div>
    <div class="card-body">
      <!-- Form thêm mã giảm giá -->
      <form th:action="@{/admin/dotgiamgia/add}" th:object="${newDotagiamgia}" method="post"
            class="row g-4">
        <div class="row">
          <!-- Cột bên trái -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="tenMaGiamGia" class="form-label">Tên Mã Giảm Giá</label>
              <input type="text" class="form-control" id="tenMaGiamGia" th:field="*{ten}"
                     placeholder="Nhập tên mã giảm giá" required>
            </div>
            <div class="mb-3">
              <label for="maGiamGia" class="form-label">Mã Giảm Giá</label>
              <input type="text" class="form-control" id="maGiamGia" th:field="*{ma}"
                     placeholder="Nhập mã giảm giá" required>
            </div>
            <div class="mb-3">
              <label for="giaTriDonToiThieu" class="form-label">Giá Trị Đơn Tối Thiểu</label>
              <input type="number" class="form-control" id="giaTriDonToiThieu"
                     th:field="*{donToiThieu}" placeholder="Nhập giá trị đơn tối thiểu" required>
            </div>
            <div class="mb-3">
              <label for="giaTriGiamGia" class="form-label">Giá Trị Giảm</label>
              <input type="number" class="form-control" id="giaTriGiamGia" th:field="*{giaTriGiam}"
                     placeholder="Nhập giá trị giảm" required>
            </div>
            <div class="mb-3">
              <label for="giaTriGiamToiDa" class="form-label">Giá Trị Giảm Tối Đa</label>
              <input type="number" class="form-control" id="giaTriGiamToiDa" th:field="*{giamToiDa}"
                     placeholder="Nhập giá trị giảm tối đa" required>
            </div>
          </div>

          <!-- Cột bên phải -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="tongSoLuong" class="form-label">Tổng Số Lượng</label>
              <input type="number" class="form-control" id="tongSoLuong" th:field="*{soLuong}"
                     placeholder="Nhập tổng số lượng" required>
            </div>
            <div class="mb-3">
              <label for="ngayBatDauApDung" class="form-label">Ngày Bắt Đầu Áp Dụng</label>
              <input type="date" class="form-control" id="ngayBatDauApDung" th:field="*{ngayBatDau}"
                     required>
            </div>
            <div class="mb-3">
              <label for="ngayKetThucApDung" class="form-label">Ngày Kết Thúc Áp Dụng</label>
              <input type="date" class="form-control" id="ngayKetThucApDung"
                     th:field="*{ngayKetThuc}" required>
            </div>
            <div class="mb-3">
              <label for="trangThaiMaGiamGia" class="form-label">Trạng Thái</label>
              <select class="form-select" id="trangThaiMaGiamGia" th:field="*{trangThai}">
                <option value="1">Hoạt động</option>
                <option value="0">Không hoạt động</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="hinhThucGiamGiaId" class="form-label">Hình Thức Giảm Giá</label>
              <select class="form-select" id="hinhThucGiamGiaId" th:field="*{hinhThucGiamGiaId}">
                <option value="1">Chuyển Khoản</option>
                <option value="0">Tiền mặt</option>
                <option value="2">Tất cả</option>
              </select>
            </div>
          </div>
        </div>
        <!-- Nút hành động -->
        <div class="mt-4 text-center">
          <button type="submit" class="btn btn-dark me-2">Thêm Mã Giảm Giá</button>
          <a th:href="@{/admin/dotgiamgia/list}" class="btn btn-secondary">Hủy</a>
        </div>
      </form>
    </div>
  </div>
</section>

<script>// Hàm validateField
function validateField(event) {
  const field = event.target;
  const value = field.value.trim();
  let errorMessage = '';

  // Lấy các giá trị của các trường liên quan
  const minOrderValue = parseFloat(document.getElementById('giaTriDonToiThieu')?.value || 0);
  const discountValue = parseFloat(document.getElementById('giaTriGiamGia')?.value || 0);
  const maxDiscountValue = parseFloat(document.getElementById('giaTriGiamToiDa')?.value || 0);

  switch (field.id) {
    case 'giaTriDonToiThieu':
      if (isNaN(minOrderValue) || minOrderValue <= 0) {
        errorMessage = "Giá trị đơn tối thiểu phải là số nguyên dương lớn hơn 0.";
      } else if (discountValue > minOrderValue) {
        errorMessage = "Giá trị giảm không được lớn hơn giá trị đơn tối thiểu.";
      } else if (maxDiscountValue > minOrderValue) {
        errorMessage = "Giá trị giảm tối đa không được lớn hơn giá trị đơn tối thiểu.";
      }
      break;

    case 'giaTriGiamGia':
      if (isNaN(discountValue) || discountValue <= 0) {
        errorMessage = "Giá trị giảm phải là số nguyên dương lớn hơn 0.";
      } else if (discountValue > minOrderValue) {
        errorMessage = "Giá trị giảm không được lớn hơn giá trị đơn tối thiểu.";
      } else if (discountValue > maxDiscountValue) {
        errorMessage = "Giá trị giảm không được lớn hơn giá trị giảm tối đa.";
      }
      break;

    case 'giaTriGiamToiDa':
      if (isNaN(maxDiscountValue) || maxDiscountValue <= 0) {
        errorMessage = "Giá trị giảm tối đa phải là số nguyên dương lớn hơn 0.";
      } else if (maxDiscountValue > minOrderValue) {
        errorMessage = "Giá trị giảm tối đa không được lớn hơn giá trị đơn tối thiểu.";
      }
      break;
  }

  // Hiển thị lỗi ngay lập tức
  showFieldError(field, errorMessage);

  // Cập nhật trạng thái nút submit
  updateSubmitButtonState();
}

// Hàm hiển thị lỗi cho từng trường
function showFieldError(field, message) {
  // Xóa thông báo lỗi cũ
  let errorElement = field.nextElementSibling;
  if (errorElement && errorElement.classList.contains('error-message')) {
    errorElement.remove();
  }

  // Nếu có lỗi, thêm thông báo lỗi
  if (message) {
    errorElement = document.createElement('div');
    errorElement.className = 'error-message text-danger mt-1';
    errorElement.textContent = message;
    field.parentElement.appendChild(errorElement);
  }
}

// Hàm kiểm tra trạng thái hợp lệ của cả form
function isFormValid() {
  const minOrderValue = parseFloat(document.getElementById('giaTriDonToiThieu')?.value || 0);
  const discountValue = parseFloat(document.getElementById('giaTriGiamGia')?.value || 0);
  const maxDiscountValue = parseFloat(document.getElementById('giaTriGiamToiDa')?.value || 0);

  // Kiểm tra tính hợp lệ của các trường
  if (
      isNaN(minOrderValue) || minOrderValue <= 0 ||
      isNaN(discountValue) || discountValue <= 0 ||
      isNaN(maxDiscountValue) || maxDiscountValue <= 0 ||
      discountValue > minOrderValue ||
      maxDiscountValue > minOrderValue ||
      discountValue > maxDiscountValue
  ) {
    return false;
  }

  return true;
}

// Hàm bật/tắt nút "Cập nhật"
function updateSubmitButtonState() {
  const submitButton = document.querySelector('button[type="submit"]');
  if (submitButton) {
    submitButton.disabled = !isFormValid();
  }
}

// Gán sự kiện onchange cho các trường
document.getElementById('giaTriDonToiThieu')?.addEventListener('input', validateField);
document.getElementById('giaTriGiamGia')?.addEventListener('input', validateField);
document.getElementById('giaTriGiamToiDa')?.addEventListener('input', validateField);

// Kiểm tra trạng thái nút submit khi trang được tải
window.addEventListener('load', function() {
  updateSubmitButtonState();
});

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
