<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Giỏ Hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fff; color: #000; }
    .btn-dark { background-color: #000; border-color: #000; }
    .btn-secondary { background-color: #fff; border: 1px solid #000; color: #000; }
    .btn-secondary:hover { background-color: #000; color: #fff; }
  </style>
</head>
<body>
<div class="container mt-5">
  <h2 class="text-center mb-4">Giỏ Hàng</h2>
  <div th:if="${message}" class="alert alert-success">
    <span th:text="${message}"></span>
  </div>

  <table class="table table-bordered">
    <thead class="table-dark">
    <tr>
      <th>STT</th>
      <th>Tên Sản Phẩm</th>
      <th>Màu Sắc</th>
      <th>Kích Thước</th>
      <th>Số Lượng</th>
      <th>Đơn Giá</th>
      <th>Tổng Tiền</th>
      <th>Thao Tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item, iter : ${gioHang.chiTietGioHang}">
      <td th:text="${iter.count}"></td>
      <td th:text="${item.sanPhamChiTiet.sanPham.tenSanPham}"></td>
      <td th:text="${item.sanPhamChiTiet.mauSac.ten}"></td>
      <td th:text="${item.sanPhamChiTiet.kichCo.ten}"></td>
      <td>
        <form th:action="@{/giohang/update}" method="post">
          <input type="hidden" name="idGioHangChiTiet" th:value="${item.id}">
          <input type="hidden" name="idKhachHang" th:value="${gioHang.idKhachHang}">
          <input type="number" name="soLuong" th:value="${item.soLuong}" min="1">
          <button type="submit" class="btn btn-dark btn-sm">Cập nhật</button>
        </form>
      </td>
      <td th:text="${item.gia}"></td>
      <td th:text="${item.gia * item.soLuong}"></td>
      <td>
        <form th:action="@{/giohang/remove}" method="post">
          <input type="hidden" name="idGioHangChiTiet" th:value="${item.id}">
          <input type="hidden" name="idKhachHang" th:value="${gioHang.idKhachHang}">
          <button type="submit" class="btn btn-dark btn-sm">Xóa</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <h4>Tổng tiền: <span th:text="${total}"></span>đ</h4>

  <form th:action="@{/giohang/apply-discount}" method="post" class="mb-3">
    <input type="hidden" name="idKhachHang" th:value="${gioHang.idKhachHang}">
    <label>Nhập mã giảm giá:</label>
    <input type="text" name="maGiamGia">
    <button type="submit" class="btn btn-dark">Áp dụng</button>
  </form>

  <form th:action="@{/giohang/checkout}" method="post">
    <input type="hidden" name="idKhachHang" th:value="${gioHang.idKhachHang}">
    <div class="mb-3">
      <label>Tên người nhận:</label>
      <input type="text" name="tenNguoiNhan" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Số điện thoại:</label>
      <input type="text" name="sdt" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Địa chỉ:</label>
      <input type="text" name="diaChi" class="form-control" required>
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-dark">Thanh toán</button>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
