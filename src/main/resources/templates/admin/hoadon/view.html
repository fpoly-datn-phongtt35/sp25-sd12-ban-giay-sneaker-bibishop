<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Chi Tiết Hóa Đơn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .status-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .status-item { padding: 10px; background-color: #f8f9fa; border: 1px solid #000; }
    .status-item.active { background-color: #000; color: #fff; }
  </style>
</head>
<body>
<div class="container mt-5">
  <h2 class="text-center">Chi Tiết Hóa Đơn</h2>

  <!-- Thanh trạng thái -->
  <div class="status-bar">
    <div class="status-item" th:classappend="${hoaDon.trangThai == 'CHO_XAC_NHAN'} ? 'active'">Chờ xác nhận</div>
    <div class="status-item" th:classappend="${hoaDon.trangThai == 'DA_XAC_NHAN'} ? 'active'">Đã xác nhận</div>
    <div class="status-item" th:classappend="${hoaDon.trangThai == 'DANG_VAN_CHUYEN'} ? 'active'">Đang vận chuyển</div>
    <div class="status-item" th:classappend="${hoaDon.trangThai == 'HOAN_THANH'} ? 'active'">Hoàn thành</div>
    <div class="status-item" th:classappend="${hoaDon.trangThai == 'HUY'} ? 'active'">Hủy</div>
  </div>

  <!-- Cập nhật trạng thái -->
  <form th:action="@{/hoadon/update-status/{id}(id=${hoaDon.id})}" method="post">
    <select name="trangThai">
      <option value="CHO_XAC_NHAN">Chờ xác nhận</option>
      <option value="DA_XAC_NHAN">Đã xác nhận</option>
      <option value="DANG_VAN_CHUYEN">Đang vận chuyển</option>
      <option value="HOAN_THANH">Hoàn thành</option>
      <option value="HUY">Hủy</option>
    </select>
    <button type="submit" class="btn btn-dark">Cập nhật trạng thái</button>
  </form>

  <!-- Thông tin hóa đơn -->
  <div class="mt-4">
    <p><strong>Thời gian tạo:</strong> <span th:text="${hoaDon.ngayTao}"></span></p>
    <p><strong>Tên khách hàng:</strong> <span th:text="${hoaDon.tenKhachhang}"></span></p>
    <p><strong>Số điện thoại:</strong> <span th:text="${hoaDon.sdtKhachhang}"></span></p>
    <p><strong>Địa chỉ:</strong> <span th:text="${hoaDon.diaChi}"></span></p>
    <p><strong>Mã hóa đơn:</strong> <span th:text="${hoaDon.maHoaDon}"></span></p>
  </div>

  <!-- Danh sách sản phẩm -->
  <table class="table table-bordered">
    <thead class="table-dark">
    <tr>
      <th>STT</th>
      <th>Tên Sản Phẩm</th>
      <th>Số Lượng</th>
      <th>Đơn Giá</th>
      <th>Tổng Tiền</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item, iter : ${hoaDon.chiTietHoaDon}">
      <td th:text="${iter.count}"></td>
      <td th:text="${item.sanPhamChiTiet.sanPham.tenSanPham}"></td>
      <td th:text="${item.soLuong}"></td>
      <td th:text="${item.gia}"></td>
      <td th:text="${item.gia * item.soLuong}"></td>
    </tr>
    </tbody>
  </table>

  <h4>Tổng tiền: <span th:text="${hoaDon.tongTien}"></span>đ</h4>
  <a th:href="@{/hoadon/export/{id}(id=${hoaDon.id})}" class="btn btn-dark">Xuất hóa đơn</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
