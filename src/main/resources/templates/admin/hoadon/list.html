<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Danh Sách Hóa Đơn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fff; color: #000; }
    .btn-dark { background-color: #000; border-color: #000; }
    .page-link { background-color: #000; color: #fff; border: 1px solid #000; }
    .page-link:hover { background-color: #fff; color: #000; border: 1px solid #000; }
    .page-item.active .page-link { background-color: #000; color: #fff; }
    .page-item.disabled .page-link { background-color: #666; color: #fff; }
  </style>
</head>
<body>
<div class="container mt-5">
  <h2 class="text-center">Danh Sách Hóa Đơn</h2>
  <table class="table table-bordered">
    <thead class="table-dark">
    <tr>
      <th>STT</th>
      <th>Mã Hóa Đơn</th>
      <th>ID Khách Hàng</th>
      <th>Giá Trị Đơn Hàng</th>
      <th>Thao Tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="hoaDon, iter : ${list.content}">
      <td th:text="${iter.count + (list.number * list.size)}"></td>
      <td th:text="${hoaDon.maHoaDon}"></td>
      <td th:text="${hoaDon.khachHang.id}"></td>
      <td th:text="${hoaDon.tongTien}"></td>
      <td>
        <a th:href="@{/hoadon/view/{id}(id=${hoaDon.id})}" class="btn btn-dark btn-sm">Xem</a>
      </td>
    </tr>
    </tbody>
  </table>

  <nav aria-label="Page navigation">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${list.hasPrevious()} ? '' : 'disabled'">
        <a class="page-link" th:href="@{/hoadon/list(page=${list.number - 1}, size=${list.size})}" aria-label="Previous">«</a>
      </li>
      <li class="page-item" th:each="i : ${#numbers.sequence(0, list.totalPages - 1)}" th:classappend="${list.number == i} ? 'active'">
        <a class="page-link" th:href="@{/hoadon/list(page=${i + 1}, size=${list.size})}" th:text="${i + 1}"></a>
      </li>
      <li class="page-item" th:classappend="${list.hasNext()} ? '' : 'disabled'">
        <a class="page-link" th:href="@{/hoadon/list(page=${list.number + 1}, size=${list.size})}" aria-label="Next">»</a>
      </li>
    </ul>
  </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
